<h3>products</h3>

                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>id</th>
                            <th>product</th>
                            <th>price</th>
                            <th>quantity</th>
                            <th>action</th>

                        </tr>
                    </thead>
                    <tbody>
                        @for (item of items; track $index) {

                        <tr>
                            <td>{{item.id}}</td>
                            <td>{{item.product}}</td>
                            <td>{{item.price}}</td>
                            <td>{{item.quantity}}</td>
                            <td><button class="btn btn-danger" (click)="onRemove(item.id)"> remove</button></td>


                        </tr>
                        }
                    </tbody>
                </table>
